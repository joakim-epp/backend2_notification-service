spring.application.name=notification-service
server.port=${PORT}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Same three values as the customer service.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=pensionat-customer-service
app.jwt.audience=pensionat

customer.service.url=${CUSTOMER_SERVICE_URL}

spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# The liveness group answers whether the process is up, readiness also checks the database.
management.endpoint.health.probes.enabled=true
