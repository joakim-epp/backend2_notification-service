spring.application.name=notification-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/notificationdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# Same three values as the customer service, otherwise its tokens are rejected here.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=pensionat-customer-service
app.jwt.audience=pensionat

customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8080}

# The liveness group answers whether the process is up, readiness also checks the database.
management.endpoint.health.probes.enabled=true
